name: Run analysis

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Borsagator composed commands (overrides vars.COMMANDS)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run commands
        run: ${{ inputs.commands || vars.COMMANDS }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
